name: Update upcoming albums

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - '.github/workflows/update-albums.yml'

permissions:
  contents: write

concurrency:
  group: upcoming-albums
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test parser, retention, patterns and publishing safeguards
        run: python -m unittest discover -s tests -v
      - name: Refresh calendar when due and expire old albums
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python scripts/update_feed.py --scheduled
          else
            python scripts/update_feed.py
          fi
      - name: Commit validated feed and retention history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upcoming-albums.txt data/albums.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming album feed"
            git push
          fi
      - name: Publish to the existing gist
        if: vars.PUBLISH_GIST == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/publish_gist.py
      - name: Report publication mode
        env:
          PUBLISH_GIST: ${{ vars.PUBLISH_GIST }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('data/status.json').read_text())
          config = json.loads(Path('config.json').read_text())
          mode = 'Gist publication enabled' if os.environ.get('PUBLISH_GIST') == 'true' else 'Preview only: gist has not been changed'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"{mode}\n\nValidated {s['album_count']} albums and {s['pattern_count']} patterns for {s['as_of']}.\n\nMode: {s['update_mode']}. Source refresh: every {config['source_refresh_days']} days; next due {s['next_source_fetch']}.\n\nRetention: {config['retain_days']} days after release; expired albums removed daily.\n")
          PY
