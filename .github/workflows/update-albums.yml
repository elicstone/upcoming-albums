name: Update upcoming albums

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - '.github/workflows/update-albums.yml'

permissions:
  contents: write

concurrency:
  group: upcoming-albums
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser, retention, patterns and publishing safeguards
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate the live calendar
        run: python scripts/update_feed.py
      - name: Commit validated feed and retention history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upcoming-albums.txt data/albums.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming album feed"
            git push
          fi
      - name: Publish to the existing gist
        if: vars.PUBLISH_GIST == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/publish_gist.py
      - name: Report publication mode
        env:
          PUBLISH_GIST: ${{ vars.PUBLISH_GIST }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('data/status.json').read_text())
          mode = 'Gist publication enabled' if os.environ.get('PUBLISH_GIST') == 'true' else 'Preview only: gist has not been changed'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"{mode}\n\nValidated {s['album_count']} albums and {s['pattern_count']} patterns for {s['as_of']}.\n\nRetention: 14 days after release.\n")
          PY
